version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting build process..."
      - echo "Branch: $CODEBUILD_WEBHOOK_HEAD_REF"

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t abode-webapp .

  post_build:
    commands:
      - echo "Build completed successfully."
      - echo "Branch: $CODEBUILD_WEBHOOK_HEAD_REF"
      - |
        if [ "$CODEBUILD_WEBHOOK_HEAD_REF" = "refs/heads/master" ]; then
          echo "Master branch detected - production deployment will run here."
        elif [ "$CODEBUILD_WEBHOOK_HEAD_REF" = "refs/heads/develop" ]; then
          echo "Develop branch detected - testing only."
        fi
