version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting build..."
      - echo "Checking website files..."
      - test -f index.html
      - test -d images

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t abode-webapp .

  post_build:
    commands:
      - echo "Build completed successfully."
      - |
        if [ "$CODEBUILD_WEBHOOK_HEAD_REF" = "refs/heads/master" ]; then
          echo "Master branch detected. Uploading image to ECR."
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 131696161928.dkr.ecr.us-east-2.amazonaws.com
          docker tag abode-webapp:latest 131696161928.dkr.ecr.us-east-2.amazonaws.com/abode-webapp:latest
          docker push 131696161928.dkr.ecr.us-east-2.amazonaws.com/abode-webapp:latest
        else
          echo "Develop branch detected. Testing only."
        fi
